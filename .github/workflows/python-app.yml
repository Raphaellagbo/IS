name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          flake8 --max-line-length=120

      - name: Check migrations exist
        run: |
          echo "Checking migrations/versions for verification migration..."
          ls migrations/versions | grep -q 'f3e4d5c6b7a8' || (echo "Required migration 'f3e4d5c6b7a8' not found" && exit 1)

      - name: Apply Alembic migrations (smoke check)
        env:
          FLASK_APP: app.py
        run: |
          python - <<'PY'
          from alembic import command, config
          cfg = config.Config('alembic.ini')
          command.upgrade(cfg, 'head')
          print('Alembic upgrade ran successfully')
          PY

      - name: Run tests with coverage
        run: |
          pytest --maxfail=1 -q --cov=.
      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}